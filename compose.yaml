services:
  client:
    build:
      context: ../enteksis_client
      dockerfile: Containerfile
      args:
        VITE_API_BASE_URL: http://localhost:${HTTP_PORT:-8080}
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-enteksis}:${POSTGRES_PASSWORD:-enteksis_dev_password}@db:5432/${POSTGRES_DB:-enteksis}?sslmode=disable
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enteksis}
      POSTGRES_USER: ${POSTGRES_USER:-enteksis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enteksis_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
