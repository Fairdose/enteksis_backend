services:
  client:
    build:
      context: ../enteksis_client
      dockerfile: Containerfile
      args:
        VITE_API_BASE_URL: http://localhost:${HTTP_PORT:-8080}
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-ent_challange}:${POSTGRES_PASSWORD:-ent_challange_dev_password}@db:5432/${POSTGRES_DB:-ent_challange}?sslmode=disable
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: Containerfile.postgres
    restart: "no"
    environment:
      PGDATABASE: ${POSTGRES_DB:-ent_challange}
      PGUSER: ${POSTGRES_USER:-ent_challange}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ent_challange_dev_password}
    command: ["sh", "-c", "for file in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -h db -f \"$$file\"; done"]
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: Containerfile.postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ent_challange}
      POSTGRES_USER: ${POSTGRES_USER:-ent_challange}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ent_challange_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
