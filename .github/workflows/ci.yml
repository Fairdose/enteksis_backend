name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ent_challange
          POSTGRES_USER: ent_challange
          POSTGRES_PASSWORD: ent_challange_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ent_challange -d ent_challange"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/api
